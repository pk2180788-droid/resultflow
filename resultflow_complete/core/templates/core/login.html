<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">{% load static %}<link rel="stylesheet" href="{% static 'css/style.css' %}"><title>ResultFlow Login</title></head><body class="login-bg"><form method="post" class="login-card">{% csrf_token %}<div class="logo">🎓 Result<span>Flow</span></div><p class="muted">Sign in to your academic workspace</p>{% for message in messages %}<p>{{ message }}</p>{% endfor %}<label>Username</label><input name="username" required autofocus><label>Password</label><input type="password" name="password" required><button class="btn primary">Sign in →</button><small class="muted">Use the account provided by your administrator.</small></form></body></html>
