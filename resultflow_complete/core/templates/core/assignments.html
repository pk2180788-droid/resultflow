{% extends 'core/base.html' %}{% block content %}<div class="heading"><div><p class="eyebrow">ADMINISTRATION</p><h1>Teacher assignments</h1><p>Assign subjects and classes to teachers.</p></div></div><div class="panel"><form method="post">{% csrf_token %}{{ form.as_p }}<button class="btn primary">Assign subject</button></form></div><div class="panel"><table><tr><th>Teacher</th><th>Subject</th><th>Class</th></tr>{% for a in assignments %}<tr><td>{{ a.teacher.username }}</td><td>{{ a.subject }}</td><td>{{ a.class_name }}</td></tr>{% endfor %}</table></div>{% endblock %}
