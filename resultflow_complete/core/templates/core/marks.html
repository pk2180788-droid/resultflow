{% extends 'core/base.html' %}{% block content %}<header><h1>Marks</h1></header><section class="panel"><h2>Enter marks</h2><form method="post">{% csrf_token %}{{form.as_p}}<button class="btn primary">Save marks</button></form></section><section class="panel"><table><tr><th>Student</th><th>Subject</th><th>Exam</th><th>Marks</th><th>Grade</th><th></th></tr>{% for m in marks %}<tr><td>{{m.student.full_name}}</td><td>{{m.subject.name}}</td><td>{{m.exam.name}}</td><td>{{m.marks_obtained}}/{{m.max_marks}}</td><td>{{m.grade}}</td><td><a class="danger" href="{% url 'mark_delete' m.id %}" onclick="return confirm('Delete mark?')">Delete</a></td></tr>{% endfor %}</table></section>{% endblock %}
