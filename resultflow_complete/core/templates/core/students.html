{% extends 'core/base.html' %}{% block content %}<header><div><p class="eyebrow">MANAGEMENT</p><h1>Students</h1></div><a class="btn primary" href="{% url 'student_add' %}">+ Add student</a></header><form class="search" method="get"><input name="q" value="{{q}}" placeholder="Search name or roll number"><button class="btn">Search</button></form><section class="panel"><table><tr><th>Roll No.</th><th>Name</th><th>Email</th><th>Class</th><th>Actions</th></tr>{% for s in students %}<tr><td>{{s.roll_number}}</td><td>{{s.full_name}}</td><td>{{s.email}}</td><td>{{s.class_name}}</td><td><a href="{% url 'student_edit' s.id %}">Edit</a> · <a class="danger" href="{% url 'student_delete' s.id %}" onclick="return confirm('Delete this student?')">Delete</a></td></tr>{% empty %}<tr><td colspan="5">No students found.</td></tr>{% endfor %}</table></section>{% endblock %}
